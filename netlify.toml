[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[dev]
  autoLaunch = false

[functions]
  included_files = ["data/**"]

[functions."ingest-pdf"]
  timeout = 900

[functions."match-plants"]
  timeout = 26

[functions."analyze-image"]
  timeout = 26

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=0, must-revalidate"
